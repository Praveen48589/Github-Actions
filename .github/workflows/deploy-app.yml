name: Deploy

on:
    workflow_dispatch:


jobs:
    deploy:
        env: 
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up docker compose 
              uses: docker/setup-compose-action@v4

            - name: Deploy with docker compose
              run: docker compose up -d --build
          
