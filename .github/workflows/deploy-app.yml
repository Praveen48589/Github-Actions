name: Deploy

on:   # after build and push workflow  steps it works >>
  workflow_run:
    workflows:
      - docker build #workflow name >>
    types:
      - completed



jobs:
    deploy:
        if: ${{github.event.workflow_run.conclusion == 'success' }}
        env: 
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}  
            DOCKER_TAG: ${{ github.sha}}
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up docker compose 
              uses: docker/setup-compose-action@v4

            - name: Deploy with docker compose
              run: c
                
