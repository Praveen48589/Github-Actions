name: Image Scanner 

on:
    workflow_call:


jobs:
    image-scanner:
        runs-on: ubuntu-latest
        steps:
            - name: Login To Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Trivy Scanner
              uses: aquasecurity/trivy-action@v0.35.0
              with:
                severity: 'CRITICAL'
                exit-code: '1'