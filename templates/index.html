<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Success </title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
            border-radius: 15px;
            background: #1e293b;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
        }

        h1 {
            color: #38bdf8;
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            color: #cbd5e1;
        }

        .status {
            margin-top: 20px;
            font-size: 28px;
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 CI/CD Working Hurrah!!!</h1>

        <p>Your Docker + GitHub Actions deployment is successful.</p>

        <div class="status">
            ✅ Latest Version Deployed
        </div>
    </div>

</body>
</html>
